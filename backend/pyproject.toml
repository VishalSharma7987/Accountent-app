[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgermind-backend"
version = "0.1.0"
description = "LedgerMind AI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "python-dotenv",
    "openpyxl",
    "reportlab",
    "python-multipart",
    "pandas",
    "pypdf",
    "defusedxml",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyyaml",
]
# OCR for scanned PDFs / photos is OPTIONAL (docs/PHASE7_PLAN.md section 6): install one of these, plus its binary, only if you need it.
ocr-tesseract = ["pytesseract", "Pillow", "pypdfium2"]   # also needs the Tesseract program (see plan)
ocr-paddle = ["paddleocr", "paddlepaddle", "pypdfium2"]  # heavy (hundreds of MB); no separate program

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Default run = fast tests with no database. `-m integration` = database tests only.
# Everything (required before every commit): pytest -m "integration or not integration"
addopts = "-m 'not integration' --strict-markers"
markers = ["integration: needs the database (runs only in the ledgermind_test schema)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# unpacking a helper's tuple and ignoring part of it is normal in tests
ignore = ["RUF059"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: Depends/Query/Header in argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
