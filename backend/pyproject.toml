[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgermind-backend"
version = "0.1.0"
description = "LedgerMind AI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "python-dotenv",
    "openpyxl",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "httpx",
    "pyyaml",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Default run = fast tests with no database. `-m integration` = database tests only.
# Everything (required before every commit): pytest -m "integration or not integration"
addopts = "-m 'not integration' --strict-markers"
markers = ["integration: needs the database (runs only in the ledgermind_test schema)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# unpacking a helper's tuple and ignoring part of it is normal in tests
ignore = ["RUF059"]
